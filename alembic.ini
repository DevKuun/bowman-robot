# Alembic configuration file

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncate migration slug
truncate_slug_length = 40

# Timezone for migration timestamps (default UTC)
# timezone = UTC

# SQLAlchemy URL (will be overridden by env.py)
sqlalchemy.url = postgresql://postgres:password@localhost:5432/bowmandb

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
